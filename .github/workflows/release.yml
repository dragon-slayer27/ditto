name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Check the tag matches the manifest version
        run: |
          v=$(node -p "require('./extension/manifest.json').version")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match manifest version $v"; exit 1; }
      - run: npm run pack
      - name: Publish the release with the extension zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/ditto-extension.zip --title "Ditto $GITHUB_REF_NAME" --notes-file .github/release-notes.md
